<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instabox Matrix</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./vendor/xterm.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="brand-text">
          <strong>INSTABOX <span>MATRIX</span></strong>
          <em>OC // control plane</em>
        </div>
      </div>
      <div class="oc-status" id="oc-status" aria-live="polite"></div>
      <div class="topbar-actions">
        <button class="icon-btn rail-toggle-btn" data-act="rail-toggle" title="折叠账号栏" aria-label="折叠账号栏">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" opacity=".25"/><path d="M9 4v16M16 9l-3 3 3 3"/></svg>
        </button>
        <label class="account-picker">
          <span>账号</span>
          <select id="account-select" aria-label="选择账号">
            <option value="all">全部账号</option>
          </select>
        </label>
        <button class="ghost-btn" data-act="matrix-keepalive" title="对当前筛选的全部机器续租一次">
          <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
          保活
        </button>
        <button class="ghost-btn" data-act="matrix-recycle" title="对已启用自动回收的机器各执行一次回收">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2M21 12a9 9 0 0 1-15.5 6.2M20 4v5h-5M4 20v-5h5"/></svg>
          回收
        </button>
        <button class="ghost-btn" data-act="matrix-sync" title="同步 egress 租约与槽位状态">
          <svg viewBox="0 0 24 24"><path d="M4 7h11l-3-3M20 17H9l3 3"/><rect x="3" y="3" width="18" height="18" rx="3" opacity=".25"/></svg>
          同步 Egress
        </button>
        <button class="ghost-btn" data-act="matrix" title="矩阵看板：分组、标签与批量执行">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          矩阵
        </button>
        <button class="icon-btn" data-act="probe-net-all" title="刷新网络（探测 IP）" aria-label="刷新网络">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
        </button>
        <button class="icon-btn" data-act="refresh" title="刷新" aria-label="刷新">
          <svg viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>
        </button>
        <button class="icon-btn" data-act="settings" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.12.36.42.67.79.79H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.21Z"/></svg>
        </button>
        <button class="primary-btn" data-act="create-machine">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          新建
        </button>
        <button class="ghost-btn" data-act="add-account">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          添加账号
        </button>
      </div>
    </header>

    <div class="workspace" id="workspace">
      <aside class="account-rail" id="account-rail" aria-label="账号列表">
        <section class="accounts-panel" id="accounts-panel">
          <div class="accounts-head">
            <div class="accounts-heading">
              <span class="accounts-title">账号</span>
              <span class="accounts-count" id="accounts-count"></span>
            </div>
            <div class="group-bar" id="group-bar"></div>
            <div class="accounts-tools">
              <label class="accounts-search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="account-filter" type="search" placeholder="搜索账号 / 组织 / 邮箱…" autocomplete="off" />
              </label>
              <div class="view-switch" role="group" aria-label="账号展示方式">
                <button data-act="account-view" data-view="chips" title="标签视图">标签</button>
                <button data-act="account-view" data-view="list" title="紧凑列表">列表</button>
                <button data-act="account-view" data-view="table" title="表格视图">表格</button>
              </div>
              <button class="small-btn" data-act="accounts-toggle" id="accounts-toggle" title="收起账号面板">收起</button>
            </div>
          </div>
          <div class="accounts-body" id="accounts"></div>
        </section>
      </aside>

      <div class="rail-resizer" id="rail-resizer" role="separator" aria-orientation="vertical" title="拖拽调整账号栏宽度，双击复位"></div>

      <div class="workspace-main">
        <section class="stats" id="stats"></section>

        <section class="toolbar">
          <div class="filter">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="filter-input" type="search" placeholder="过滤机器名 / ID / 模板…" autocomplete="off" />
          </div>
          <div class="toolbar-meta" id="toolbar-meta"></div>
        </section>

        <main id="grid" class="grid" aria-live="polite"></main>

        <section class="footer">
          <span id="footer-status">等待连接…</span>
          <span class="footer-hint">Instabox API · 本地服务代理 · Key 不进入面板</span>
        </section>
      </div>
    </div>
  </div>

  <div id="terminal-drawer" class="terminal-drawer" hidden></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="modal-root"></div>

  <script src="./vendor/xterm.js"></script>
  <script src="./vendor/addon-fit.js"></script>
  <script src="./main.js"></script>
</body>
</html>
